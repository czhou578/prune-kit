# The coding workflow with the data of the record (spark-moe-specialize), for a model with no known answer. The data
# does not depend on the model: the same sessions gave the rank of the Qwen prune by hand. `points: auto` takes the
# first three default cuts of the model.
name: coding-record
data:
  sources: []                                    # the data exists: prune-moe-kit data builds nothing for this file
  folder: ~/Projects/dsv4-specialize/data/qwen-data
memory: {context: 128000, margin_gib: 4}
points: auto
