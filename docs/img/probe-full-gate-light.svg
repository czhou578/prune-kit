<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A 41-minute probe shows how deep a cut can go</title>
<rect x="0.5" y="0.5" width="879" height="509" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="32" y="46" font-size="23" font-weight="650" fill="#0b0b0b" text-anchor="start">A 41-minute probe shows how deep a cut can go</text>
<text x="32" y="72" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Inkling-2-Mini with coding sessions. The loss of three cuts against the full model: lower is better.</text>
<text x="32" y="92" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">The full gate needs 103 minutes, and each of its results is inside the band of the probe.</text>
<rect x="34" y="113" width="14" height="18" rx="4" fill="#2a78d6" fill-opacity="0.22"/>
<line x1="30" y1="122" x2="52" y2="122" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/>
<text x="60" y="127" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Probe: 20 turns, with the band of 90% of new samples</text>
<circle cx="41" cy="145" r="5.5" fill="#eb6834"/>
<text x="60" y="150" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Full gate: 60 turns</text>
<line x1="84" y1="395.0" x2="548" y2="395.0" stroke="#c3c2b7"/>
<text x="74" y="399.5" font-size="12.5" font-weight="400" fill="#898781" text-anchor="end">0%</text>
<line x1="84" y1="318.3" x2="548" y2="318.3" stroke="#e1e0d9"/>
<text x="74" y="322.8" font-size="12.5" font-weight="400" fill="#898781" text-anchor="end">+2%</text>
<line x1="84" y1="241.7" x2="548" y2="241.7" stroke="#e1e0d9"/>
<text x="74" y="246.2" font-size="12.5" font-weight="400" fill="#898781" text-anchor="end">+4%</text>
<line x1="84" y1="165.0" x2="548" y2="165.0" stroke="#e1e0d9"/>
<text x="74" y="169.5" font-size="12.5" font-weight="400" fill="#898781" text-anchor="end">+6%</text>
<line x1="84" y1="280.0" x2="548" y2="280.0" stroke="#52514e" stroke-width="1.5"/>
<text x="90" y="272.0" font-size="12.5" font-weight="600" fill="#52514e" text-anchor="start">Limit of the gate: +3% of loss (NLL)</text>
<rect x="161" y="348.6" width="18" height="37.2" rx="4" fill="#2a78d6" fill-opacity="0.22"/>
<line x1="154" y1="367.4" x2="186" y2="367.4" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="170" cy="368.6" r="5.5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="194" y="373.6" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">+0.69%</text>
<text x="170" y="419" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="middle">120 of 128</text>
<text x="170" y="437" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">frees 0.91 GiB</text>
<circle cx="148" cy="452" r="6.5" fill="#0ca30c"/>
<path d="M145 452.2l2.2 2.2 3.8-4.4" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="159" y="456.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">passes</text>
<rect x="307" y="268.9" width="18" height="82.4" rx="4" fill="#2a78d6" fill-opacity="0.22"/>
<line x1="300" y1="317.9" x2="332" y2="317.9" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="316" cy="319.5" r="5.5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="340" y="324.5" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">+1.97%</text>
<text x="316" y="419" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="middle">112 of 128</text>
<text x="316" y="437" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">frees 1.82 GiB</text>
<circle cx="294" cy="452" r="6.5" fill="#0ca30c"/>
<path d="M291 452.2l2.2 2.2 3.8-4.4" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="305" y="456.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">passes</text>
<rect x="453" y="183.0" width="18" height="119.2" rx="4" fill="#2a78d6" fill-opacity="0.22"/>
<line x1="446" y1="251.2" x2="478" y2="251.2" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="462" cy="232.5" r="5.5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="486" y="237.5" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">+4.24%</text>
<text x="462" y="419" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="middle">104 of 128</text>
<text x="462" y="437" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">frees 2.74 GiB</text>
<circle cx="440" cy="452" r="6.5" fill="#d03b3b"/>
<path d="M437.5 449.5l5 5m0-5l-5 5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="451" y="456.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">fails</text>
<text x="316" y="481" font-size="12.5" font-weight="400" fill="#898781" text-anchor="middle">Experts that each layer keeps, and the result of the full gate</text>
<line x1="576" y1="112" x2="576" y2="486" stroke="#e1e0d9"/>
<text x="600" y="127" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">112 of 128 experts: each gate passes</text>
<text x="600" y="147" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">The results of its other gates</text>
<line x1="600" y1="168" x2="848" y2="168" stroke="#e1e0d9"/>
<text x="600" y="190" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">Weights of the model</text>
<text x="600" y="218" font-size="24" font-weight="650" fill="#0b0b0b" text-anchor="start">−1.82 GiB</text>
<text x="600" y="236" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">of 18.78 GiB</text>
<line x1="600" y1="248" x2="848" y2="248" stroke="#e1e0d9"/>
<text x="600" y="270" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">Tool-call tasks, of 85</text>
<text x="600" y="298" font-size="24" font-weight="650" fill="#0b0b0b" text-anchor="start">51</text>
<text x="600" y="316" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">full model: 49</text>
<line x1="600" y1="328" x2="848" y2="328" stroke="#e1e0d9"/>
<text x="600" y="350" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">Blind judge, 30 pairs</text>
<text x="600" y="378" font-size="24" font-weight="650" fill="#0b0b0b" text-anchor="start">No loss</text>
<text x="600" y="396" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">13 better, 6 worse, 11 equal</text>
<line x1="600" y1="408" x2="848" y2="408" stroke="#e1e0d9"/>
<text x="600" y="430" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">Decode speed</text>
<text x="600" y="458" font-size="24" font-weight="650" fill="#0b0b0b" text-anchor="start">−0.2%</text>
<text x="600" y="476" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">37.5 against 37.6 tokens per second</text>
</svg>
