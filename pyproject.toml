[project]
name = "prune-kit"
version = "0.1.0"
description = "One pipeline that prunes a local mixture-of-experts (MoE) model for one workflow."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/czhou578/prune-kit"

[project.scripts]
prune-kit = "prune_moe_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prune_moe_kit"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
