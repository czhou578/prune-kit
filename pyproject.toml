[project]
name = "prune-kit"
version = "0.1.0"
description = "One pipeline that prunes a local model for one workflow."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
prune-kit = "prune_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prune_kit"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
